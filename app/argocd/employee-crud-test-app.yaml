apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: employee-crud-test
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/hansessay/gitops-configs
    targetRevision: main
    path: apps/employee-crud-test

  destination:
    server: https://kubernetes.default.svc
    namespace: employee-crud-test

  syncPolicy:
    automated:
      prune: true
      selfHeal: true