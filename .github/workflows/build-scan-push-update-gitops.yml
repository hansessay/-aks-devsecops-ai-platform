- name: Update image tag in GitOps repo
  run: |
    cd gitops
    MANIFEST_PATH=$(find . -name "${{ env.MANIFEST_FILE }}" | head -n 1)

    if [ -z "$MANIFEST_PATH" ]; then
      echo "ERROR: ${{ env.MANIFEST_FILE }} not found in GitOps repo"
      find . -name "*.yaml"
      exit 1
    fi

    echo "Updating image in $MANIFEST_PATH"
    sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" "$MANIFEST_PATH"

    git config user.name "github-actions"
    git config user.email "github-actions@github.com"
    git add "$MANIFEST_PATH"
    git commit -m "ci: update image tag to ${{ github.sha }}" || echo "No changes to commit"
    git push