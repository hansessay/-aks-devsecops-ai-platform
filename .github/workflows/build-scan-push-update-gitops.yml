name: Build Scan Push Update GitOps

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: aks-devsecops-app
  GITOPS_REPO: hansessay/gitops-configs
  GITOPS_BRANCH: main
  MANIFEST_FILE: backend-complete.yaml

jobs:
  build-scan-push-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          ref: ${{ env.GITOPS_BRANCH }}

      - name: Update image tag in GitOps repo
        run: |
          cd gitops

          MANIFEST_PATH=$(find . -name "${{ env.MANIFEST_FILE }}" | head -n 1)

          if [ -z "$MANIFEST_PATH" ]; then
            echo "ERROR: ${{ env.MANIFEST_FILE }} not found in GitOps repo"
            echo "Available YAML files:"
            find . -name "*.yaml"
            exit 1
          fi

          echo "Updating image in $MANIFEST_PATH"

          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" "$MANIFEST_PATH"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add "$MANIFEST_PATH"

          git commit -m "ci: update image tag to ${{ github.sha }}" || echo "No changes to commit"

          git push